include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/data/api/generated/**"
    # gen-l10n output (namespace_key getters): generated, not hand-written.
    - "lib/l10n/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Scratch space for files waiting to be deleted (git-ignored).
    - _to_delete/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - avoid_print
