name: sportpadi_mobile
description: sportpadi — native mobile client (Flutter).
publish_to: "none"
version: 1.3.30+28

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Storage
  flutter_secure_storage: ^10.0.0

  # Models (used once codegen lands)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  geolocator: ^13.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  # Foreground pushes on Android are shown as system notifications with this.
  flutter_local_notifications: ">=17.0.0 <21.0.0"
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  # App Store in-app purchase for the group plan. Anything unlocking in-app
  # functionality must be bought this way (App Store guideline 3.1.1); tickets,
  # entry fees and fines are real-world services and stay on the web checkout.
  in_app_purchase: ^3.2.0
  # Imported directly for the iOS offer-code redemption sheet.
  in_app_purchase_storekit: ">=0.3.0 <1.0.0"
  # AdMob (Android only for now): app-open + native units, see core/ads/admob.dart.
  # 7.0+ is the first release built for Gradle/AGP 9; the open range lets pub
  # pick the newest one the installed Flutter SDK allows (8.0 needs 3.38.1+).
  google_mobile_ads: ">=7.0.0 <10.0.0"
  # iOS App Tracking Transparency prompt, asked once before the first ad.
  app_tracking_transparency: ^2.0.6
  # Sign in with Google / Apple. The native buttons produce an ID token the
  # server verifies (Better Auth `/sign-in/social` with `idToken`), so no
  # browser round-trip and no client secret in the app. Apple is iOS-only
  # (docs/sso-setup.md in the workspace has the console steps).
  google_sign_in: ^7.1.0
  sign_in_with_apple: ^7.0.1
  # sha256 of the Apple nonce (the raw one goes to the server, the hash to Apple).
  crypto: ^3.0.3
  # Universal Links / App Links. Handles BOTH the cold-start link and the
  # warm stream; the cold-start half is what makes a shared link work when the
  # app wasn't already running.
  app_links: ^6.3.2
  app_settings: ^5.1.1
  # Officiant mode keeps the screen on while the timekeeper runs the clock.
  wakelock_plus: ">=1.2.0 <2.0.0"
  # App version for targeting in-app messages (already resolved via wakelock_plus).
  package_info_plus: ">=8.0.0 <11.0.0"
  # Google Play in-app updates: the optional update downloads in the
  # background, a required one uses Play's full-screen flow (Android only).
  in_app_update: ">=4.2.2 <6.0.0"
  intl: ^0.19.0
  # Event times are stored as a naive wall clock plus the venue's IANA zone.
  # Browsers get the tz database free from ICU; Dart does not — `timezone`
  # ships it so the app can convert a kick-off at the venue into the phone's
  # own clock. `flutter_timezone` reads the device's zone (no location
  # permission: the OS already knows).
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Generate app icons from the brand logo:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#EBF0ED"
  adaptive_icon_foreground: "assets/images/icon-foreground.png"
  remove_alpha_ios: true
