org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Belt and braces for third-party plugin modules whose own build files pin
# Java 8/11 next to Kotlin 1.8: the root build.gradle.kts aligns them to 17;
# should one slip through, report it instead of failing the release build.
kotlin.jvm.target.validation.mode=warning
# mobile_scanner: use the Google Play Services (unbundled) barcode model
# instead of shipping ML Kit's own inside the app. The bundled one is the
# single largest library in the bundle (libbarhopper ~5 MB per ABI + ~1 MB of
# .tflite assets); the unbundled one is fetched by Play Services on first
# scan and shared across apps. Devices without Play Services can't scan —
# acceptable for a gate-scanning admin feature.
dev.steenbakker.mobile_scanner.useUnbundled=true
